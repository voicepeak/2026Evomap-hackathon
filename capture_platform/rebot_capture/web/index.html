<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RDP 采集端 · rebot-capture</title>
  <link rel="stylesheet" href="style.css?v=full-hud-6" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="health-dot"></span>
      <strong>RDP 采集端</strong>
      <span class="muted" id="version">v-</span>
    </div>
    <div class="topbar-right">
      <div class="status-chips" id="status-chips"></div>
      <button id="btn-dashboard" class="btn small ghost">面板</button>
      <button id="btn-fullscreen" class="btn small ghost">全屏</button>
    </div>
  </header>

  <!-- ① 遥操作全屏层：整屏画板 + 四角 HUD -->
  <div id="teleop-view">
    <div id="pad" class="pad">
      <div class="pad-crosshair"></div>
      <div id="pad-toast" class="pad-toast"></div>
      <div class="pad-hint">笔尖落笔 = 运动控制 · 抬笔 = 悬停<br />
        <small>笔右键：单击 = 切换电机（J1…J6/夹爪） · 长按 = 切换 位置/姿态</small></div>
    </div>

    <div id="hud-layer">
      <div class="hud hud-tl">
        <div class="hud-stack">
          <div id="core-status" class="hud-title">—</div>
          <div id="core-msg" class="hud-sub"></div>
          <div class="hud-row">
            <button id="c-freeze" class="btn small">冻结 (Space)</button>
            <button id="c-speed" class="btn small">速度：中 (F)</button>
            <button id="c-mode" class="btn small">模式：位置 (O)</button>
            <button id="c-float" class="btn small">悬停 (H)</button>
            <button id="c-align" class="btn small ghost">对齐 (R)</button>
            <button id="c-gesture" class="btn small">手势夹爪：—</button>
          </div>
        </div>
      </div>

      <div class="hud hud-tr">
        <div class="cam-tile">
          <img id="cam-a" alt="" />
          <span id="cam-a-label" class="cam-label">腕部</span>
        </div>
        <div class="cam-tile">
          <img id="cam-b" alt="" />
          <span id="cam-b-label" class="cam-label">电脑</span>
        </div>
      </div>

      <div class="hud hud-bl">
        <span class="muted small">笔</span><b id="pen-hz">0 Hz</b>
        <span class="muted small">压力</span><b id="pen-p">0.00</b>
        <span id="pen-touch" class="small">抬笔</span>
        <span class="hud-sep"></span>
        <span class="muted small">手势</span><b id="gesture-state">—</b>
      </div>

      <div class="hud hud-bc">
        <span id="core-joints" class="hud-btns"></span>
        <span class="hud-sep"></span>
        <button id="btn-park" class="btn small ghost">回零</button>
      </div>

      <div class="hud hud-br">
        <span class="badge" id="rec-state">空闲</span>
        <button id="btn-session" class="btn small">开始会话</button>
        <button id="btn-start" class="btn small primary" disabled>开始 Episode</button>
        <button id="btn-stop" class="btn small danger" disabled>结束（成功）</button>
        <button id="btn-stop-fail" class="btn small" disabled>结束（失败）</button>
      </div>
    </div>
  </div>

  <!-- ② 控制面板：相机 / 关节 / 质量 / 数据集（点右上角「面板」呼出） -->
  <div id="dashboard" class="hidden">
    <main class="grid">
      <!-- 左列：相机 -->
      <section class="col">
        <div class="card">
          <div class="card-head"><h2>相机</h2><span class="muted small" id="cam-status">未连接</span></div>
          <div class="camera">
            <img id="cam-stream" alt="" />
            <div class="camera-hint" id="cam-hint">点「探测相机」→ 选设备 → 预览</div>
          </div>
          <div class="row muted small" style="margin-top:8px; gap:8px; display:flex; align-items:center; flex-wrap:wrap;">
            <button id="btn-cam-probe" class="btn small">探测相机</button>
            <span id="cam-list"></span>
            <button id="btn-cam-close" class="btn small ghost">关闭相机</button>
          </div>
        </div>
      </section>

      <!-- 中列：关节 + 质量 + 录制设置 -->
      <section class="col">
        <div class="card">
          <div class="card-head"><h2>关节状态</h2><span class="muted small" id="fps-line">0 fps</span></div>
          <div id="joints" class="joints"></div>
        </div>

        <div class="card">
          <div class="card-head"><h2>质量</h2></div>
          <div class="lights">
            <span class="light" id="light-drop">丢帧</span>
            <span class="light" id="light-limit">限位</span>
            <span class="light" id="light-smooth">平滑</span>
            <span class="light" id="light-occlusion">遮挡</span>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>录制 / 数据集</h2><span class="muted small">录制按钮在遥操作界面右下角</span></div>
          <div class="controls">
            <button id="btn-discard" class="btn ghost" disabled>丢弃当前 Episode</button>
          </div>
          <div class="row muted small" id="session-info">未开始会话</div>
          <div class="controls" style="margin-top:10px">
            <span class="muted small" style="align-self:center">回放：</span>
            <button id="btn-replay-1" class="btn small">1×</button>
            <button id="btn-replay-2" class="btn small">2×</button>
            <button id="btn-replay-4" class="btn small">4×</button>
            <span id="replay-status" class="muted small"></span>
          </div>
        </div>
      </section>

      <!-- 右列：任务 + episode 列表 + 打包 -->
      <section class="col">
        <div class="card">
          <div class="card-head"><h2>任务卡</h2><span class="muted small">占位</span></div>
          <div class="task">
            <div class="task-title">抓取 - 放置（桌面）</div>
            <div class="task-meta">目标 30 条 · 质量 ≥ B · 奖励 ¥ —</div>
            <div class="bar"><div class="bar-fill" id="task-progress" style="width:0%"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Episode 列表</h2>
            <button id="btn-pack" class="btn small">打包数据集</button>
          </div>
          <div id="episodes" class="episodes"><div class="muted small">暂无数据</div></div>
          <div id="pack-result" class="muted small"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js?v=full-hud-6"></script>
</body>
</html>
